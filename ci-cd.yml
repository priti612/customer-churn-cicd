name: Customer Churn CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python code
        run: python -m compileall -q app.py train.py feature_engineering.py test_app.py

      - name: Run automated tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/customer-churn:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/customer-churn:latest .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/customer-churn:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/customer-churn:latest
